<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Photos from University of Sussex Chess Society events, tournaments and club activities." />
  <title>Photos - University of Sussex Chess Society</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 260px;
      gap: 0.85rem;
    }

    .gallery-photo {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: var(--surface, #eee);
      cursor: zoom-in;
    }

    .gallery-photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .35s ease;
    }

    .gallery-photo:hover img {
      transform: scale(1.025);
    }

    .gallery-photo.tall { grid-row: span 2; }
    .gallery-photo.wide { grid-column: span 2; }

    .gallery-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgba(0,0,0,.9);
      cursor: zoom-out;
    }

    .gallery-lightbox.open { display: flex; }

    .gallery-lightbox img {
      max-width: min(1200px, 94vw);
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
    }

    @media (max-width: 800px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: 220px;
      }
    }

    @media (max-width: 560px) {
      .gallery-grid {
        grid-template-columns: 1fr;
        grid-auto-rows: 260px;
      }
      .gallery-photo.tall,
      .gallery-photo.wide {
        grid-row: span 1;
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="page">
    <div class="page-header" data-icon="📷">
      <p class="section-label" style="margin-bottom:0.8rem;">University of Sussex Chess Society</p>
      <h1>Photos</h1>
      <p style="color:rgba(255,255,255,0.7); margin-top:1rem; font-size:1.1rem;">
        Moments from our tournaments, club nights and society events.
      </p>
    </div>

    <section class="wide">
      <p class="section-label" style="margin-bottom:1.5rem;">Society Gallery</p>

      <div class="gallery-grid">
        <div class="gallery-photo wide"><img src="images/gallery/sussex-chess-01.webp" alt="Sussex chess event presentation" loading="lazy"></div>
        <div class="gallery-photo tall"><img src="images/gallery/sussex-chess-02.webp" alt="Chess player at a Sussex event" loading="lazy"></div>
        <div class="gallery-photo"><img src="images/gallery/sussex-chess-03.webp" alt="Guest at a Sussex chess event" loading="lazy"></div>
        <div class="gallery-photo"><img src="images/gallery/sussex-chess-04.webp" alt="Sussex Chess Festival shirts" loading="lazy"></div>
        <div class="gallery-photo wide"><img src="images/gallery/sussex-chess-05.webp" alt="Talk at a Sussex chess event" loading="lazy"></div>
        <div class="gallery-photo"><img src="images/gallery/sussex-chess-06.webp" alt="Players competing at the Sussex chess event" loading="lazy"></div>
        <div class="gallery-photo"><img src="images/gallery/sussex-chess-07.webp" alt="Tournament chess game" loading="lazy"></div>
        <div class="gallery-photo tall"><img src="images/gallery/sussex-chess-08.webp" alt="Chess player portrait" loading="lazy"></div>
        <div class="gallery-photo"><img src="images/gallery/sussex-chess-09.webp" alt="Speaker at a Sussex chess event" loading="lazy"></div>
        <div class="gallery-photo"><img src="images/gallery/sussex-chess-10.webp" alt="Sussex chess event organisers" loading="lazy"></div>
      </div>
    </section>
  </div>

  <div class="gallery-lightbox" id="gallery-lightbox" aria-hidden="true">
    <img id="gallery-lightbox-image" src="" alt="">
  </div>

  <div id="footer-placeholder"></div>

  <script src="components.js"></script>
  <script>
    const lightbox = document.getElementById('gallery-lightbox');
    const lightboxImage = document.getElementById('gallery-lightbox-image');

    document.querySelectorAll('.gallery-photo img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImage.src = img.src;
        lightboxImage.alt = img.alt;
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImage.src = '';
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImage.src = '';
      }
    });
  </script>
</body>
</html>
